# HTTPS 版 compose（叠加在 prod 之上）
# 用法：docker compose -f docker-compose.prod.yml -f docker-compose.ssl.yml up -d --build web
services:
  web:
    build:
      context: ./client
      args:
        USE_SSL: "true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 挂载 SSL 证书
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - hw_net
