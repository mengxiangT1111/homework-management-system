# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name mengxiangt.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                    # nginx:alpine ≥1.25 支持；旧版本改用 listen 443 ssl http2;
    server_name mengxiangt.top;

    # ===== SSL 证书（docker-compose 挂载到 /etc/nginx/ssl，换证书只需替换文件后 restart） =====
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # ===== 安全响应头 =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.myqcloud.com; font-src 'self' data:; connect-src 'self' https://*.myqcloud.com; frame-src 'self' blob: data: https://*.myqcloud.com; media-src 'self' blob: data: https://*.myqcloud.com; object-src 'none'; base-uri 'self';" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 静态资源长缓存
    # 注意：location 内一旦出现 add_header，就不再继承 server 级的全部 add_header，
    # 因此这里必须重复声明安全响应头（否则 /assets/* 会静默丢失 CSP 等防护）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.myqcloud.com; font-src 'self' data:; connect-src 'self' https://*.myqcloud.com; frame-src 'self' blob: data: https://*.myqcloud.com; media-src 'self' blob: data: https://*.myqcloud.com; object-src 'none'; base-uri 'self';" always;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传文件已统一走 /api/files/download 授权接口（后端 /uploads 静态路由已移除），
    # 文件预览/下载由上方 /api/ 代理承载

    # SPA 前端路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
