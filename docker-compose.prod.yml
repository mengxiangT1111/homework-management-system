# 生产环境部署：MySQL + 后端 + 前端 一键启动

services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: hw_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-homework_db}
      MYSQL_USER: ${DB_USER:-homework}
      MYSQL_PASSWORD: ${DB_PASSWORD:-homework123}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-allowed-packet=128M
    healthcheck:
      # 不带凭证 ping：拒绝访问响应同样证明服务器存活，
      # 且避免口令出现在 docker inspect / 进程列表里
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 容器标准输出日志容量上限（防止 json-file 日志无限增长堆满磁盘）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hw_net

  # ===== 后端 API =====
  backend:
    build: ./server
    container_name: hw_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      # 查重微服务仅要求启动顺序在前：token 未配置时后端本就不启用查重，
      # 其故障不应阻塞后端启动
      detection:
        condition: service_started
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-homework_db}
      DB_USER: ${DB_USER:-homework}
      DB_PASSWORD: ${DB_PASSWORD:-homework123}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_EXPIRES_IN: 7d
      UPLOAD_DIR: uploads
      FILE_RETAIN_DAYS: 30
      NODE_ENV: production
      # nginx 反代场景按 X-Forwarded-For 取真实客户端 IP，
      # 否则登录限流会把所有用户算成同一个代理 IP（全局误锁）
      TRUST_PROXY: "1"
      # 管理员初始账号（src/seeders/seedProd.js 首次初始化时使用，登录后仍建议修改）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # ===== 可选：AI 批改（留空则 AI 批改功能不可用） =====
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      # ===== 可选：AI 批改升级（模板化+异步队列+人工复核，均有默认值可不配置） =====
      AI_MODEL_FALLBACK: ${AI_MODEL_FALLBACK:-}          # 备用模型（主模型熔断时降级），留空禁用
      AI_TIMEOUT: ${AI_TIMEOUT:-60000}                   # 单次 LLM 请求超时(ms)
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}               # 单模型网络层重试次数
      GRADING_CONCURRENCY: ${GRADING_CONCURRENCY:-3}     # 批改队列并发数
      GRADING_POLL_INTERVAL: ${GRADING_POLL_INTERVAL:-2000} # 队列轮询间隔(ms)
      GRADING_MAX_ATTEMPTS: ${GRADING_MAX_ATTEMPTS:-3}   # 任务级最大尝试次数
      GRADING_REVIEW_THRESHOLD: ${GRADING_REVIEW_THRESHOLD:-0.6} # 置信度阈值，低于进人工复核
      GRADING_AUTO_APPLY: ${GRADING_AUTO_APPLY:-1}       # 高置信结果自动回写分数(1/0)
      # ===== 可选：A2 自一致性双评（默认关；开启后每份 LLM 调用翻倍） =====
      GRADING_DUAL_GRADE: ${GRADING_DUAL_GRADE:-0}       # 1=启用同题二次批改，分差过大转人工复核
      GRADING_DUAL_TAU: ${GRADING_DUAL_TAU:-0.05}        # 双评分差阈值（按满分归一化）
      GRADING_DUAL_TEMPERATURE: ${GRADING_DUAL_TEMPERATURE:-0.7} # 双评第二次采样温度
      # ===== L1 查重×批改联动（查重高相似的提交 AI 批改强制转人工复核） =====
      GRADING_PLAGIARISM_REVIEW_THRESHOLD: ${GRADING_PLAGIARISM_REVIEW_THRESHOLD:-50} # 相似度阈值(%)，0=关闭
      # ===== 可选：腾讯云 COS（留空则作业文件存本地数据卷） =====
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      # ===== 可选：查重检测服务（默认走 compose 内网服务名，指向下方 detection 容器） =====
      DETECTION_SERVICE_URL: ${DETECTION_SERVICE_URL:-http://detection:8000}
      # 服务间共享鉴权 token（必配才能启用查重，与 detection 容器同值；留空则查重功能整体禁用）
      DETECTION_API_TOKEN: ${DETECTION_API_TOKEN:-}
    volumes:
      - backend_uploads:/app/uploads
      # 运行日志（访问/错误日志落盘文件，容器内自动轮转清理）持久化到宿主机
      - backend_logs:/app/logs
    # 进程探活：node 直连 3000，收到任意 HTTP 状态码（含 404/401）即视为存活；
    # 崩溃循环时 docker ps 会显示 unhealthy，部署脚本也据此告警
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 容器标准输出日志容量上限（防止 json-file 日志无限增长堆满磁盘）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hw_net

  # ===== 查重检测微服务（Python FastAPI + OpenCV） =====
  # 仅容器内网可访问（不映射宿主机端口）；与 backend 共享 uploads 卷，
  # 后端把 COS 文件物化到 uploads/_detection_tmp 后传路径过来检测
  detection:
    build: ./server/detection_service
    container_name: hw_detection
    restart: always
    environment:
      TZ: Asia/Shanghai
      # 与 backend 共享同一 token（留空则两侧互拒，查重功能禁用）
      DETECTION_API_TOKEN: ${DETECTION_API_TOKEN:-}
      # 与 backend 挂同一卷且路径一致，保证传给检测服务的文件路径两侧同样可见
      UPLOAD_DIR: /app/uploads
    volumes:
      # 作业文件只读（检测服务只读取，不写入）
      - backend_uploads:/app/uploads
    healthcheck:
      # /api/health 免鉴权；用 python 探测（slim 镜像无 curl）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 容器标准输出日志容量上限
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hw_net

  # ===== 前端 (Nginx) =====
  frontend:
    build: ./client
    container_name: hw_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./client/ssl:/etc/nginx/ssl:ro
    # 容器标准输出日志容量上限（nginx access/error 日志走容器 stdout/stderr）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hw_net

volumes:
  mysql_data:
  backend_uploads:
  backend_logs:

networks:
  hw_net:
    driver: bridge
