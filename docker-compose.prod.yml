# 生产环境部署：MySQL + 后端 + 前端 一键启动
version: "3.8"

services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: hw_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-homework_db}
      MYSQL_USER: ${DB_USER:-homework}
      MYSQL_PASSWORD: ${DB_PASSWORD:-homework123}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-allowed-packet=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hw_net

  # ===== 后端 API =====
  backend:
    build: ./server
    container_name: hw_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-homework_db}
      DB_USER: ${DB_USER:-homework}
      DB_PASSWORD: ${DB_PASSWORD:-homework123}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_EXPIRES_IN: 7d
      UPLOAD_DIR: uploads
      FILE_RETAIN_DAYS: 30
      NODE_ENV: production
      # nginx 反代场景按 X-Forwarded-For 取真实客户端 IP，
      # 否则登录限流会把所有用户算成同一个代理 IP（全局误锁）
      TRUST_PROXY: "1"
      # 管理员初始账号（seed.prod.js 首次初始化时使用，登录后仍建议修改）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # ===== 可选：AI 批改（留空则 AI 批改功能不可用） =====
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      # ===== 可选：腾讯云 COS（留空则作业文件存本地数据卷） =====
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      # ===== 可选：查重检测服务（仅部署了 Python 检测服务时配置，容器内访问宿主机用宿主机IP） =====
      DETECTION_SERVICE_URL: ${DETECTION_SERVICE_URL:-http://localhost:8000}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - hw_net

  # ===== 前端 (Nginx) =====
  frontend:
    build: ./client
    container_name: hw_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - hw_net

volumes:
  mysql_data:
  backend_uploads:

networks:
  hw_net:
    driver: bridge
